[package]
name = "ameise-adviser"
version = "0.1.0"
edition = "2024"
default-run = "ameise-adviser"

[dependencies]
axum = "0.8"
chrono = "0.4"
percent-encoding = "2"
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
rusqlite = { version = "0.38", features = ["bundled"] }
serde = "1"
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "process", "io-util", "time"] }
url = "2"
